version: '3.8'

services:
  qdrant_db:
    image: qdrant/qdrant:v1.12.5
    container_name: qdrant_poc_php
    ports:
      - "6333:6333" # Porta da API HTTP que seu PHP vai usar
      - "6334:6334" # Porta gRPC (opcional, para performance avançada)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - RUN_MODE=production
    restart: always

volumes:
  qdrant_data:
